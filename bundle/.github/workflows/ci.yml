name: ci
on:
  push: { branches: [main] }
  pull_request:
env:
  GO_VERSION: "1.25"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: "${{ env.GO_VERSION }}" }
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

  roundtrip:
    name: create, sign, verify, tamper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: "${{ env.GO_VERSION }}" }
      # The unit tests cover the format. This covers the thing an operator
      # actually does, end to end, including the case that matters most: a
      # tampered bundle must fail with the documented exit code, not merely
      # print something.
      - name: End-to-end
        run: |
          set -euo pipefail
          go build -o /tmp/tsb ./cmd/tessera-bundle
          go install github.com/DAVANO-INNOVATION-LAB/tessera/sign/cmd/tessera-sign@latest
          work=$(mktemp -d); cd "$work"
          mkdir -p data && echo '{"vulns":[]}' > data/osv.json
          "$(go env GOPATH)/bin/tessera-sign" keygen --out .
          /tmp/tsb create ./data --out p.tsb --name ci --kind vulnerability-database \
            --source osv.dev --retrieved 2026-01-01T00:00:00Z
          /tmp/tsb sign p.tsb --key signing.key
          /tmp/tsb verify p.tsb --public signing.pub

          cp p.tsb bad.tsb && cp p.tsb.sig bad.tsb.sig && printf x >> bad.tsb
          set +e; /tmp/tsb verify bad.tsb --public signing.pub >/dev/null 2>&1; code=$?; set -e
          [ "$code" = 3 ] || { echo "tampered bundle exited $code, want 3"; exit 1; }

          /tmp/tsb extract p.tsb --dest out --public signing.pub
          test -f out/osv.json
          echo "round trip ok"
